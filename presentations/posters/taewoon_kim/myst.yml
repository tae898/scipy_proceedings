extends: ../../../proceedings.yml
project:
  title: "ArcadeDB in Python: An In-Process Multi-Model Database"
  authors:
    - name: Taewoon Kim
      affiliation: HumemAI
      orcid: 0000-0003-2892-0194
      url: https://taewoon.kim/
  abstract: |
    Scientific Python workflows increasingly mix three kinds of data access over the same
    data: transactional reads and writes over records, traversals over relationships, and
    similarity search over vector embeddings. In practice these are split across separate
    systems and glued together with custom ETL. This poster presents arcadedb-embedded,
    Python bindings that bring an embedded, multi-model database into the in-process
    scientific-Python ecosystem: a single pip install provides documents, a property graph,
    and HNSW vector search in one process, with no server to deploy. The contribution is not
    the engine (ArcadeDB, a mature Apache-2.0 Java engine, which we credit) but its
    enablement from Python via a JPype binding over a bundled per-platform Java runtime. We
    demonstrate a single hybrid retrieval workflow that combines vector search, SQL filtering,
    and graph traversal over one dataset in one transaction, and characterize the
    embedded-from-Python experience against specialist embedded peers (SQLite, DuckDB,
    LadybugDB, Chroma), including its costs.
